; Without this file `pytest` collects nothing useful: DJANGO_SETTINGS_MODULE is
; never set, so every test that touches models dies at import with
; ImproperlyConfigured. The Vipps tests have been unrunnable since they were
; written for exactly this reason.
;
; The existing tests are pytest-style (`pytestmark = pytest.mark.django_db`),
; so pytest-django is the harness rather than `manage.py test`.
[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = apps

; Quiet the third-party deprecation noise that otherwise buries real warnings.
; authlib's is raised by apps/users/vipps_login.py on every single import.
filterwarnings =
    ignore::DeprecationWarning:authlib.*
